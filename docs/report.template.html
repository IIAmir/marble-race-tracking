<title>Marble Tracking Feasibility</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: a long-form evidence report in presentable sections (each fits a screen):
   claim + tiles, method, demo, stress results, edge cases, guarantees, real time, hardware, limits. */
:root {
  --bg: #f4f6f8;
  --surface: #ffffff;
  --fg: #121820;
  --muted: #5a6574;
  --line: #dde2e8;
  --accent: #a8650a;        /* timing-board amber, darkened for light paper */
  --accent-ink: #ffffff;
  --grid: #e7eaee;
  --s1: #2a78d6; --s2: #eb6834;
  --good: #0ca30c; --warn: #fab219; --bad: #d03b3b;
  --display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f141b; --surface: #161d27; --fg: #e6e9ee; --muted: #9aa5b4; --line: #2a3442; --accent: #f2a93b; --accent-ink: #0f141b;
    --grid: #222b37; --s1: #3987e5; --s2: #d95926; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f141b; --surface: #161d27; --fg: #e6e9ee; --muted: #9aa5b4; --line: #2a3442; --accent: #f2a93b; --accent-ink: #0f141b;
  --grid: #222b37; --s1: #3987e5; --s2: #d95926; color-scheme: dark;
}
body { background: var(--bg); color: var(--fg); font: 400 16px/1.6 var(--body); }
main { max-width: 1120px; margin: 0 auto; padding-block: 28px 64px;
       padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
       display: grid; gap: 22px; }
section, .hero { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: clamp(18px, 3vw, 36px); min-width: 0; }
.hero { border-top: 4px solid var(--accent); }
.eyebrow { font: 600 12px var(--mono); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin: 0 0 10px; }
h1 { font: 700 clamp(30px, 4.6vw, 52px)/1.05 var(--display); letter-spacing: -.005em; margin: 0 0 14px; text-wrap: balance; max-width: 22ch; }
h2 { font: 700 clamp(24px, 3vw, 32px)/1.15 var(--display); margin: 0 0 8px; text-wrap: balance; }
h3 { font: 600 19px/1.25 var(--display); margin: 0 0 8px; letter-spacing: .01em; }
p { margin: 0 0 12px; max-width: 70ch; }
.lede { font-size: 18px; color: var(--fg); }
.sub { color: var(--muted); }
.note { color: var(--muted); font-size: 14px; margin-top: 10px; }
a { color: var(--accent); }
.links { display: flex; flex-wrap: wrap; gap: 10px; margin: 18px 0 22px; }
.btn { display: inline-block; padding: 9px 16px; border-radius: 6px; border: 1px solid var(--line); color: var(--fg); text-decoration: none; font-weight: 600; font-size: 15px; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.tiles { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 12px; }
.tile { border: 1px solid var(--line); border-radius: 8px; padding: 12px 14px; display: grid; gap: 2px; align-content: start; }
.tile strong { font: 700 34px/1.05 var(--display); }
.tile span { font: 600 13px var(--body); }
.tile small { color: var(--muted); font-size: 12.5px; line-height: 1.4; }
.tiles.small .tile strong { font-size: 26px; }
.two { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 28px; align-items: start; margin-top: 14px; }
.two > * { min-width: 0; }
.facts { padding-left: 18px; margin: 0; display: grid; gap: 8px; }
.facts li { max-width: 70ch; }
.diagram { background: var(--bg); border-radius: 8px; padding: 12px; overflow-x: auto; }
.diagram pre { margin: 0; }
.media figure { margin: 0; }
video { width: 100%; border-radius: 8px; background: #000; display: block; }
figcaption { font-size: 14px; color: var(--muted); margin-top: 8px; }
.chartbox { margin: 16px 0 0; }
.chartbox figcaption { margin: 0 0 8px; color: var(--fg); display: flex; flex-wrap: wrap; gap: 4px 14px; align-items: baseline; }
.legend { color: var(--muted); font-size: 13px; display: inline-flex; flex-wrap: wrap; gap: 4px 12px; align-items: center; }
.legend i { display: inline-block; width: 11px; height: 11px; border-radius: 3px; vertical-align: -1px; margin-right: 4px; }
.legend i.s1 { background: var(--s1); border-radius: 50%; } .legend i.s2 { background: var(--s2); border-radius: 50%; }
.legend i.good { background: var(--good); } .legend i.warn { background: var(--warn); } .legend i.bad { background: var(--bad); }
.legend i.curve-key { height: 2px; background: var(--muted); border-radius: 0; }
.legend i.budget-key { width: 2px; height: 14px; background: var(--fg); border-radius: 0; }
.chart { width: 100%; height: auto; display: block; overflow: visible; }
.chart .grid { stroke: var(--grid); stroke-width: 1; }
.chart .tick { fill: var(--muted); font: 11px var(--mono); font-variant-numeric: tabular-nums; }
.chart .rowlabel { fill: var(--fg); font: 12.5px var(--body); }
.chart .s1 { fill: var(--s1); } .chart .s2 { fill: var(--s2); }
.chart .good { fill: var(--good); } .chart .warn { fill: var(--warn); } .chart .bad { fill: var(--bad); }
.chart .ring { stroke: var(--surface); stroke-width: 2; }
.chart .link { stroke: var(--line); stroke-width: 2; }
.chart .curve { fill: none; stroke: var(--muted); stroke-width: 2; }
.chart .limit { stroke: var(--bad); stroke-width: 1; opacity: .6; }
.chart .budget { stroke: var(--fg); stroke-width: 2; }
.chart [data-tip] { cursor: default; }
.chart [data-tip]:hover { opacity: .8; }
.tablewrap { overflow-x: auto; margin-top: 12px; }
table.data { border-collapse: collapse; width: 100%; font-size: 14px; }
table.data th { text-align: left; font: 600 12px var(--body); color: var(--muted); text-transform: uppercase; letter-spacing: .05em; padding: 8px 10px; border-bottom: 1px solid var(--line); vertical-align: bottom; }
table.data td { padding: 7px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
table.data td.n { text-align: right; font: 13px var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
table.data tr.total td { font-weight: 600; }
.chip { font: 600 12px var(--body); white-space: nowrap; }
.chip.good { color: var(--good); } .chip.bad { color: var(--bad); }
.cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 14px; margin-top: 14px; }
.card { border: 1px solid var(--line); border-radius: 8px; padding: 14px 16px; min-width: 0; }
.card p { font-size: 14.5px; }
.big { font: 700 28px/1.1 var(--display); margin: 6px 0 4px; }
.big span { font: 500 13px var(--body); color: var(--muted); display: block; }
.small { font-size: 13px; color: var(--muted); }
.phases { padding-left: 20px; margin: 0; display: grid; gap: 8px; }
pre.cmd { font: 13px/1.6 var(--mono); background: var(--bg); padding: 14px 16px; border-radius: 8px; margin: 0; white-space: pre; }
#tip { position: fixed; pointer-events: none; z-index: 10; background: var(--fg); color: var(--surface); font: 12.5px var(--body); padding: 5px 9px; border-radius: 5px; max-width: 280px; }
@media (max-width: 820px) { .two { grid-template-columns: minmax(0, 1fr); } }
</style>
<main>
<!--SECTIONS-->
</main>
<div id="tip" hidden></div>
<script>
// Hover tooltips for every chart mark that carries data-tip (keyboard: focus shows the same text).
(function () {
  const tip = document.getElementById("tip");
  document.querySelectorAll(".chart [data-tip]").forEach((el) => {
    el.setAttribute("tabindex", "0");
    el.setAttribute("aria-label", el.getAttribute("data-tip"));
    const show = (x, y) => { tip.textContent = el.getAttribute("data-tip"); tip.hidden = false;
      const w = tip.offsetWidth; tip.style.left = Math.min(window.innerWidth - w - 8, x + 12) + "px"; tip.style.top = (y + 14) + "px"; };
    el.addEventListener("mousemove", (e) => show(e.clientX, e.clientY));
    el.addEventListener("mouseleave", () => { tip.hidden = true; });
    el.addEventListener("focus", () => { const r = el.getBoundingClientRect(); show(r.right, r.top); });
    el.addEventListener("blur", () => { tip.hidden = true; });
  });
})();
</script>
