<title>Marble Race Simulator</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Saira+Semi+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: race-control console. Live 3D track (with camera feeds strip, minimap and view tools)
   on the left; timing tower, telemetry, tracker health and race log on the right; race setup on
   top; clock, replay and fault injection along the bottom. Deliberately one dark look. */
:root {
  --bg: #0e131a; --panel: #151c26; --panel-2: #1b2430; --line: #29333f;
  --fg: #e6e9ee; --muted: #8b97a7; --amber: #f2a93b; --cyan: #6cc4d8;
  --ok: #6fcf8e; --warn: #f2a93b; --bad: #ef6b5e;
  --display: "Saira Semi Condensed", "Arial Narrow", system-ui, sans-serif;
  --body: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Menlo, monospace;
  color-scheme: dark;
}
html, body { height: 100%; }
[hidden] { display: none !important; }
body { background: var(--bg); color: var(--fg); font: 14px var(--body); }
.app { height: 100%; box-sizing: border-box; display: grid; gap: 8px;
  grid-template-columns: minmax(0, 1fr) 360px; grid-template-rows: auto minmax(0, 1fr) auto;
  grid-template-areas: "top top" "view side" "bottom side";
  padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
.top, .bottom { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 12px; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 7px 10px; }
.top { grid-area: top; } .bottom { grid-area: bottom; }
.brand { font: 700 19px var(--display); letter-spacing: .02em; margin-right: 6px; white-space: nowrap; }
.brand span { color: var(--amber); }
label.f { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--muted); }
select, button { font: 500 13px var(--body); color: var(--fg); background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; padding: 5px 9px; }
button { cursor: pointer; }
button:hover, select:hover { border-color: var(--muted); }
button.primary { background: var(--amber); color: #111; border-color: var(--amber); font-weight: 600; }
button.on { border-color: var(--amber); color: var(--amber); }
button:focus-visible, select:focus-visible, input:focus-visible { outline: 2px solid var(--amber); outline-offset: 1px; }
.sep { width: 1px; height: 22px; background: var(--line); }
.view { grid-area: view; position: relative; min-height: 340px; border: 1px solid var(--line); border-radius: 6px; overflow: hidden; background: #0a0e13; }
.view canvas.gl { display: block; position: absolute; inset: 0; }
#feedOverlay, #labels { position: absolute; inset: 0; pointer-events: none; }
#labels { z-index: 1; } #feedOverlay { z-index: 2; }
.tools { position: absolute; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: calc(100% - 250px); z-index: 3; }
.tools button { padding: 4px 8px; font-size: 12px; background: rgba(21,28,38,.9); }
.zoom { position: absolute; left: 8px; top: 44px; display: flex; flex-direction: column; gap: 4px; z-index: 3; align-items: center; }
.zoom button { width: 30px; height: 30px; padding: 0; font: 600 16px var(--mono); background: rgba(21,28,38,.9); }
.zoom input { writing-mode: vertical-lr; direction: rtl; height: 110px; accent-color: var(--amber); }
#minimap { position: absolute; right: 8px; top: 8px; width: 230px; height: 170px; background: rgba(10,14,19,.86); border: 1px solid var(--line); border-radius: 5px; z-index: 3; cursor: crosshair; }
.lights { position: absolute; left: 50%; top: 18%; transform: translateX(-50%); display: flex; gap: 12px; padding: 12px 16px; background: rgba(10,14,19,.85); border-radius: 10px; z-index: 5; }
.lights i { width: 34px; height: 34px; border-radius: 50%; background: #2a1414; box-shadow: inset 0 0 0 2px #3a2020; }
.lights i.on { background: #ff3b30; box-shadow: 0 0 18px #ff3b30; }
.banner { position: absolute; left: 50%; top: 14%; transform: translateX(-50%); z-index: 5; text-align: center; background: rgba(10,14,19,.9); border: 1px solid var(--line); border-radius: 10px; padding: 14px 22px; min-width: 260px; }
.banner h3 { margin: 0 0 6px; font: 700 22px var(--display); color: var(--amber); }
.banner ol { margin: 0; padding-left: 20px; text-align: left; font: 13px var(--mono); }
.hint { position: absolute; left: 8px; bottom: 8px; font: 11px var(--mono); color: var(--muted); background: rgba(10,14,19,.8); padding: 3px 7px; border-radius: 4px; z-index: 3; }
.lbl { font: 500 11px/1.2 var(--mono); color: var(--fg); background: rgba(14,19,26,.8); border: 1px solid var(--line); padding: 1px 5px; border-radius: 3px; white-space: nowrap; }
.lbl.sel { border-color: var(--amber); color: var(--amber); }
.lbl.hide { visibility: hidden !important; }
.lbl.cam { color: var(--muted); font-size: 10px; } .lbl.cam.off { color: var(--bad); border-color: var(--bad); }
.lbl.map { color: var(--cyan); border-color: rgba(108,196,216,.35); }
.side { grid-area: side; display: flex; flex-direction: column; gap: 8px; min-height: 0; overflow: auto; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 9px 11px; min-width: 0; }
.card h2 { margin: 0 0 6px; font: 600 12.5px var(--display); letter-spacing: .12em; text-transform: uppercase; color: var(--muted); display: flex; justify-content: space-between; gap: 8px; }
.card h2 b { color: var(--fg); letter-spacing: .02em; text-transform: none; font-weight: 600; }
table.tower { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
.tower td { padding: 2px 4px; border-top: 1px solid var(--line); font-size: 12.5px; white-space: nowrap; }
.tower tr { cursor: pointer; } .tower tr:hover td { background: var(--panel-2); } .tower tr.sel td { background: rgba(242,169,59,.12); }
.tower .pos { font: 700 14px var(--display); text-align: right; width: 20px; }
.tower .dot i { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: middle; box-shadow: inset 0 0 0 1px rgba(255,255,255,.3); }
.tower .num { font: 11.5px var(--mono); color: var(--muted); text-align: right; }
.chip { font: 500 9.5px var(--mono); padding: 0 4px; border-radius: 3px; text-transform: uppercase; border: 1px solid currentColor; letter-spacing: .03em; }
.chip.tracking { color: var(--ok); } .chip.coasting { color: var(--warn); } .chip.lost { color: var(--bad); } .chip.photo { color: var(--bad); }
.chip.finished { color: var(--amber); } .chip.unseen, .chip.acquiring, .chip.grid { color: var(--muted); }
.kv { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 5px; }
.kv div { background: var(--panel-2); border-radius: 4px; padding: 4px 6px; min-width: 0; }
.kv span { display: block; font: 9.5px var(--mono); color: var(--muted); text-transform: uppercase; letter-spacing: .04em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kv strong { font: 600 14px var(--display); font-variant-numeric: tabular-nums; }
.camgrid { display: flex; flex-wrap: wrap; gap: 3px; margin-top: 6px; }
.camgrid i { width: 18px; height: 12px; border-radius: 2px; background: var(--ok); opacity: .85; cursor: pointer; }
.camgrid i.off { background: var(--bad); }
#spark { width: 100%; height: 60px; display: block; margin-top: 6px; }
.log { font: 11.5px var(--mono); color: var(--muted); display: grid; gap: 2px; max-height: 150px; overflow: auto; }
.log .bad { color: var(--bad); } .log .ok { color: var(--ok); } .log .amb { color: var(--amber); }
.clock { font: 600 16px var(--mono); color: var(--amber); min-width: 86px; font-variant-numeric: tabular-nums; }
#scrub { flex: 1 1 160px; min-width: 120px; accent-color: var(--amber); }
.toggles { display: flex; flex-wrap: wrap; gap: 2px 10px; }
.toggles label { font-size: 12px; color: var(--muted); display: inline-flex; gap: 4px; align-items: center; }
.toggles input { accent-color: var(--amber); }
.muted { color: var(--muted); font-size: 12px; }
@media (max-width: 1000px) {
  .app { height: auto; grid-template-columns: minmax(0, 1fr); grid-template-areas: "top" "view" "bottom" "side"; }
  .view { height: 62vh; } .side { overflow: visible; } #minimap { width: 150px; height: 112px; }
  .tools { max-width: calc(100% - 170px); }
}
@media (prefers-reduced-motion: reduce) { * { scroll-behavior: auto; } }
</style>

<div class="app">
  <div class="top">
    <div class="brand">Marble Race <span>Simulator</span></div>
    <label class="f">Map <select id="map"></select></label>
    <label class="f">Marbles <select id="count"><option>6</option><option>8</option><option selected>10</option><option>12</option><option>16</option></select></label>
    <label class="f">Laps <select id="laps"><option>1</option><option>2</option><option selected>3</option><option>5</option></select></label>
    <label class="f">Chaos <select id="chaos"><option value="0.1">Calm</option><option value="0.35" selected>Normal</option><option value="0.55">Wild</option></select></label>
    <label class="f">Cameras <select id="rig"><option value="angled">14 angled cams</option><option value="overhead">1 overhead cam</option><option value="hybrid">Both</option></select></label>
    <span class="sep"></span>
    <button id="newRace" class="primary" type="button" title="New race (N)">New race</button>
    <button id="restart" type="button" title="Restart same race (R)">Restart</button>
    <button id="play" type="button" title="Pause / resume (Space)">Pause</button>
    <label class="f">Speed <select id="speed"><option value="0.1">0.1× slow-mo</option><option value="0.25">0.25×</option><option value="0.5">0.5×</option><option value="1" selected>1×</option><option value="2">2×</option><option value="4">4×</option></select></label>
  </div>

  <div class="view" id="view">
    <div id="labels"></div>
    <canvas id="feedOverlay"></canvas>
    <div class="tools" id="tools">
      <button data-view="orbit" type="button" title="Free camera: drag to orbit, right-drag to pan, wheel to zoom">Free</button>
      <button data-view="leader" type="button">Follow leader</button>
      <button data-view="selected" type="button" title="F">Follow selected</button>
      <button data-view="tv" type="button" title="Director cuts between rig cameras">TV director</button>
      <button data-view="overhead" type="button">Overhead</button>
      <button data-view="finish" type="button">Finish cam</button>
      <button id="fit" type="button">Fit track</button>
    </div>
    <div class="zoom"><button id="zin" type="button" title="Zoom in (+)">+</button><input id="zoom" type="range" min="-100" max="100" value="0" aria-label="Zoom"><button id="zout" type="button" title="Zoom out (−)">−</button></div>
    <canvas id="minimap" width="460" height="340" title="Minimap: click to look there"></canvas>
    <div class="lights" id="lights" hidden><i></i><i></i><i></i><i></i><i></i></div>
    <div class="banner" id="banner" hidden></div>
    <div class="hint" id="hint">wheel: zoom · drag: orbit · right-drag: pan · double-click: focus · click marble: select</div>
  </div>

  <div class="bottom">
    <span class="clock" id="clock">0.00 s</span>
    <button id="replay" type="button" title="Instant replay of the last 30 s">Instant replay</button>
    <input id="scrub" type="range" min="0" max="0" value="0" disabled aria-label="Replay position">
    <span class="sep"></span>
    <div class="toggles">
      <label><input type="checkbox" id="tLabels" checked> Labels</label>
      <label><input type="checkbox" id="tBoxes" checked> Tracker boxes</label>
      <label><input type="checkbox" id="tTrails" checked> Trails</label>
      <label><input type="checkbox" id="tFrustums"> Camera frustums</label>
      <label><input type="checkbox" id="tFeeds" checked> Camera feeds</label>
      <label><input type="checkbox" id="tMinimap" checked> Minimap</label>
      <label><input type="checkbox" id="tWaypoints"> Centerline</label>
      <label>Marble size <select id="mscale"><option value="1">1×</option><option value="2" selected>2×</option><option value="3">3×</option></select></label>
    </div>
    <span class="sep"></span>
    <label class="f">Faults</label>
    <button id="fCam" type="button" title="Kill the camera watching the leader">Kill camera</button>
    <button id="fLight" type="button">Dim lights</button>
    <button id="fNet" type="button">Network jitter</button>
    <button id="fReset" type="button">Clear faults</button>
  </div>

  <aside class="side">
    <section class="card">
      <h2>Timing tower <b id="towerNote"></b></h2>
      <table class="tower" id="tower"></table>
    </section>
    <section class="card">
      <h2>Telemetry <b id="selName">—</b></h2>
      <div class="kv" id="tele"></div>
      <canvas id="spark" width="660" height="120"></canvas>
      <div class="muted" id="teleNote"></div>
    </section>
    <section class="card">
      <h2>Tracker vs truth <b id="rigName"></b></h2>
      <div class="kv" id="health"></div>
      <div class="camgrid" id="camgrid" title="Click a camera to kill or restore it"></div>
    </section>
    <section class="card">
      <h2>Race control</h2>
      <div class="log" id="log"></div>
    </section>
  </aside>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/renderers/CSS2DRenderer.js"></script>
<script>
"use strict";
const $ = (id) => document.getElementById(id);
const V3 = THREE.Vector3, UP = new V3(0, 1, 0);
const TRACK_W = 0.055, WALL_H = 0.016, G = 9.81;

// ============================================================ random
function mulberry32(a) { return () => { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
// Physics has its own seeded stream (so "Restart" replays the same race); sensor noise does not.
let rnd = mulberry32(1);
const gaussOf = (r) => () => { let u = 0, v = 0; while (!u) u = r(); while (!v) v = r(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
const gauss = gaussOf(Math.random);
let pgauss = gaussOf(rnd);

// ============================================================ marbles & colour
const PALETTE = [
  ["Ruby", "#d02a33"], ["Amber", "#f5821f"], ["Sun", "#f0d22c"], ["Leaf", "#2fa84f"], ["Teal", "#1fb5be"], ["Sky", "#3c96eb"],
  ["Navy", "#1f2f96"], ["Fuchsia", "#ff00ff"], ["Rose", "#f052a8"], ["Snow", "#f2f2f2"], ["Onyx", "#2b2b2e"], ["Lime", "#a8e03c"],
  ["Cobalt", "#0000ff"], ["Mint", "#9ff0cf"], ["Plum", "#6b2350"], ["Bronze", "#a8692e"],
];
function hexToLab(hex) {
  const c = [1, 3, 5].map((i) => parseInt(hex.slice(i, i + 2), 16) / 255).map((v) => (v > 0.04045 ? ((v + 0.055) / 1.055) ** 2.4 : v / 12.92));
  const X = (0.4124 * c[0] + 0.3576 * c[1] + 0.1805 * c[2]) / 0.95047, Y = 0.2126 * c[0] + 0.7152 * c[1] + 0.0722 * c[2], Z = (0.0193 * c[0] + 0.1192 * c[1] + 0.9505 * c[2]) / 1.08883;
  const f = (t) => (t > 0.008856 ? Math.cbrt(t) : 7.787 * t + 16 / 116);
  return [116 * f(Y) - 16, 500 * (f(X) - f(Y)), 200 * (f(Y) - f(Z))];
}
const LAB = PALETTE.map(([, h]) => hexToLab(h));

// ============================================================ maps
function serpentine() {
  const pts = [], rows = 5, pitch = 0.4, R = pitch / 2, x0 = -1.1, x1 = 1.1;
  for (let r = 0; r < rows; r++) {
    const z = -0.8 + r * pitch, xs = r % 2 ? [x1, x0] : [x0, x1];
    for (let k = 0; k <= 8; k++) pts.push([xs[0] + (xs[1] - xs[0]) * k / 8, z]);
    if (r < rows - 1) { const sg = r % 2 ? -1 : 1; for (let k = 1; k < 12; k++) { const a = -Math.PI / 2 + Math.PI * k / 12; pts.push([xs[1] + sg * R * Math.cos(a), z + R + R * Math.sin(a)]); } }
  }
  return { pts: pts.map(([x, z]) => [x, 0, z]), heights: [0.95, 0.25], closed: false, tunnels: [[0.27, 0.31]], finishBack: 0.45 };
}
function alpine() {
  const pts = [], rows = 6, R = 0.27;
  for (let r = 0; r < rows; r++) {
    const z = -1.35 + r * 2 * R, dir = r % 2 ? -1 : 1, xa = -1.9 * dir, xb = 1.9 * dir;
    for (let k = 0; k <= 16; k++) { const u = k / 16; pts.push([xa + (xb - xa) * u, z + 0.09 * Math.sin(u * Math.PI * 3) * (r % 3 === 1 ? 1 : 0.4)]); }
    if (r < rows - 1) for (let k = 1; k < 12; k++) { const a = -Math.PI / 2 + Math.PI * k / 12; pts.push([xb + dir * 0.0 + dir * R * Math.cos(a), z + R + R * Math.sin(a)]); }
  }
  return { pts: pts.map(([x, z]) => [x, 0, z]), heights: [2.3, 0.2], closed: false, tunnels: [[0.18, 0.22], [0.55, 0.6], [0.82, 0.85]], finishBack: 0.45 };
}
function spiral() {
  const pts = [];
  for (let k = 0; k <= 10; k++) pts.push([-2.2 + 1.5 * k / 10, 2.75 - 0.05 * k / 10, -0.7]);
  const turns = 4, R = 0.7, n = turns * 36;
  for (let k = 0; k <= n; k++) { const a = -Math.PI / 2 + 2 * Math.PI * turns * k / n; pts.push([R * Math.cos(a), 2.65 - 2.15 * k / n, R * Math.sin(a)]); }
  for (let k = 1; k <= 10; k++) pts.push([0.0 + 2.2 * k / 10, 0.48 - 0.3 * k / 10, -0.7 - 0.0 * k]);
  return { pts, heights: null, closed: false, tunnels: [], finishBack: 0.45 };
}
function figure8() {
  const pts = [], a = 2.3;
  for (let k = 0; k < 160; k++) { const t = 2 * Math.PI * k / 160; const d = 1 + Math.sin(t) ** 2; pts.push([a * Math.cos(t) / d, 0, a * Math.sin(t) * Math.cos(t) / d * 1.25]); }
  return { pts, closed: true, lift: [0.03, 0.2], profile: [0.12, 0.85], tunnels: [[0.6, 0.66]], startAt: 0.22 };
}
function grandPrix() {
  const pts = [];
  for (let k = 0; k < 180; k++) {
    const t = 2 * Math.PI * k / 180;
    const r = 2.1 + 0.42 * Math.cos(2 * t + 0.4) + 0.3 * Math.cos(3 * t + 1.9) + 0.13 * Math.cos(5 * t + 0.7) + 0.06 * Math.cos(7 * t + 2.4);
    pts.push([1.35 * r * Math.cos(t), 0, 0.85 * r * Math.sin(t)]);
  }
  return { pts, closed: true, lift: [0.40, 0.55], profile: [0.12, 0.95], tunnels: [[0.78, 0.82]], startAt: 0.57 };
}
const MAPS = {
  serpentine: { name: "Serpentine Table", build: serpentine, laps: false, note: "3 × 2 m table, five rows, one tunnel" },
  alpine: { name: "Alpine Descent", build: alpine, laps: false, note: "2 m mountain drop, hairpins, three tunnels" },
  spiral: { name: "Spiral Tower", build: spiral, laps: false, note: "four stacked spiral levels: the overhead camera cannot see the lower ones" },
  figure8: { name: "Figure-Eight Bridge", build: figure8, laps: true, note: "lap race with a chain lift and a bridge crossing" },
  grandprix: { name: "Grand Prix", build: grandPrix, laps: true, note: "lap race, chain lift on the back straight, tunnel" },
};

// ============================================================ track
class Track {
  constructor(def) {
    this.def = def; this.closed = def.closed;
    let pts = def.pts.map((p) => new V3(...p));
    let curve = new THREE.CatmullRomCurve3(pts, this.closed, "centripetal", 0.5);
    if (def.heights || def.profile) {  // assign heights along the arc length, then rebuild
      const L0 = curve.getLength(), n = Math.max(200, Math.ceil(L0 / 0.05));
      const sp = curve.getSpacedPoints(n);
      const prof = (u) => {
        if (def.heights) return def.heights[0] + (def.heights[1] - def.heights[0]) * u;
        const [lo, hi] = def.profile, [ls, le] = def.lift;
        if (u >= ls && u <= le) return lo + (hi - lo) * (u - ls) / (le - ls);
        const span = 1 - (le - ls), q = ((u - le) % 1 + 1) % 1;
        return hi - (hi - lo) * q / span;
      };
      pts = sp.slice(0, this.closed ? n : n + 1).map((p, i) => new V3(p.x, prof(i / n), p.z));
      curve = new THREE.CatmullRomCurve3(pts, this.closed, "centripetal", 0.5);
    }
    this.curve = curve;
    this.L = curve.getLength();
    this.N = Math.ceil(this.L / 0.01);
    this.ds = this.L / this.N;
    const sp = curve.getSpacedPoints(this.N);
    const M = this.N + 1;
    this.px = new Float32Array(M); this.py = new Float32Array(M); this.pz = new Float32Array(M);
    sp.forEach((p, i) => { this.px[i] = p.x; this.py[i] = p.y; this.pz[i] = p.z; });
    this.tx = new Float32Array(M); this.ty = new Float32Array(M); this.tz = new Float32Array(M);
    this.nx = new Float32Array(M); this.nz = new Float32Array(M); this.cn = new Float32Array(M);
    for (let i = 0; i < M; i++) {
      const a = this.closed ? (i - 1 + this.N) % this.N : Math.max(0, i - 1), b = this.closed ? (i + 1) % this.N : Math.min(this.N, i + 1);
      const dx = this.px[b] - this.px[a], dy = this.py[b] - this.py[a], dz = this.pz[b] - this.pz[a], l = Math.hypot(dx, dy, dz) || 1;
      this.tx[i] = dx / l; this.ty[i] = dy / l; this.tz[i] = dz / l;

  const vmax = Math.max(0.5, ...h.map((x) => Math.abs(x[1]))) * 1.15, t0 = h[0][0], t1 = h[h.length - 1][0] || t0 + 1;
  const X = (t) => (t - t0) / Math.max(1e-6, t1 - t0) * (c.width - 10) + 5, Y = (v) => c.height - 8 - (v / vmax) * (c.height - 16);
  g.strokeStyle = "#29333f"; g.beginPath(); g.moveTo(0, Y(0)); g.lineTo(c.width, Y(0)); g.stroke();
  g.strokeStyle = W.phys.m[k].hex; g.lineWidth = 3; g.beginPath(); h.forEach(([t, v], i) => (i ? g.lineTo(X(t), Y(v)) : g.moveTo(X(t), Y(v)))); g.stroke();
  g.fillStyle = "#e6e9ee"; h.forEach(([t, , e], i) => { if (e != null && i % 3 === 0) g.fillRect(X(t) - 1.5, Y(e) - 1.5, 3, 3); });
  g.fillStyle = "#8b97a7"; g.font = "18px IBM Plex Mono, monospace"; g.fillText(vmax.toFixed(1) + " m/s", 8, 20);
}
function logMsg(text, cls) {
  const d = document.createElement("div"); d.textContent = text; if (cls) d.className = cls;
  $("log").prepend(d); while ($("log").children.length > 80) $("log").lastChild.remove();
}

// ============================================================ minimap
const mm = $("minimap"), mctx = mm.getContext("2d");
function mmXform() {
  const T = W.T; let x0 = Infinity, x1 = -Infinity, z0 = Infinity, z1 = -Infinity;
  for (let i = 0; i <= T.N; i += 10) { x0 = Math.min(x0, T.px[i]); x1 = Math.max(x1, T.px[i]); z0 = Math.min(z0, T.pz[i]); z1 = Math.max(z1, T.pz[i]); }
  const pad = 18, k = Math.min((mm.width - 2 * pad) / (x1 - x0 || 1), (mm.height - 2 * pad) / (z1 - z0 || 1));
  return { k, ox: (mm.width - k * (x1 - x0)) / 2 - k * x0, oz: (mm.height - k * (z1 - z0)) / 2 - k * z0 };
}
function drawMinimap(frame) {
  mm.hidden = !$("tMinimap").checked; if (mm.hidden) return;
  const T = W.T, X = W.mmX || (W.mmX = mmXform()), P = (x, z) => [X.ox + X.k * x, X.oz + X.k * z];
  mctx.clearRect(0, 0, mm.width, mm.height);
  const tr = W.tracker, online = (c) => (frame ? frame.online[W.cams.indexOf(c)] : tr.online[c.id]);
  for (let i = 0; i < T.N; i += 4) {  // colour each stretch by who sees it
    const s = i * T.ds, j = Math.min(T.N, i + 4);
    const seen = !T.inTunnel(s) && W.cams.some((c) => online(c) && c.covers(s) && !(c.kind === "overhead" && T.coveredAbove(s)));
    const anyCover = W.cams.some((c) => c.covers(s) && c.kind !== "finish");
    mctx.strokeStyle = T.inTunnel(s) ? "#7a4f2c" : seen ? "#4f8f62" : anyCover ? "#ef6b5e" : "#5a6370";
    if (T.inLift(s)) mctx.strokeStyle = "#f2a93b";
    mctx.lineWidth = 5; mctx.beginPath(); mctx.moveTo(...P(T.px[i], T.pz[i])); mctx.lineTo(...P(T.px[j], T.pz[j])); mctx.stroke();
  }
  const f = T.sample(T.finishS); mctx.fillStyle = "#fff"; mctx.fillRect(P(f.x, f.z)[0] - 3, P(f.x, f.z)[1] - 3, 6, 6);
  W.phys.m.forEach((b, k) => {
    const gone = frame ? frame.gone[k] : b.gone; if (gone) return;
    const s = frame ? frame.s[k] : b.s, q = T.sample(s), [x, y] = P(q.x, q.z);
    const est = frame ? frame.est[k] : tr.m[k].t != null ? tr.m[k].x[0] : null;
    if (est != null) { const e = T.sample(est), [ex, ey] = P(e.x, e.z); mctx.strokeStyle = "#e6e9ee"; mctx.lineWidth = 1.5; mctx.beginPath(); mctx.arc(ex, ey, 7, 0, 7); mctx.stroke(); }
    mctx.fillStyle = b.hex; mctx.beginPath(); mctx.arc(x, y, W.selected === k ? 7 : 5, 0, 7); mctx.fill();
  });
  mctx.fillStyle = "#8b97a7"; mctx.font = "16px IBM Plex Mono, monospace"; mctx.fillText(W.mdef.name, 10, 20);
}
mm.addEventListener("click", (e) => {
  if (!W) return;
  const r = mm.getBoundingClientRect(), X = W.mmX, x = ((e.clientX - r.left) / r.width * mm.width - X.ox) / X.k, z = ((e.clientY - r.top) / r.height * mm.height - X.oz) / X.k;
  let best = 0, bd = Infinity; for (let i = 0; i <= W.T.N; i += 5) { const d = Math.hypot(W.T.px[i] - x, W.T.pz[i] - z); if (d < bd) { bd = d; best = i; } }
  focusOn(new V3(W.T.px[best], W.T.py[best], W.T.pz[best]), 0.9);
});
function focusOn(p, dist) {
  setViewMode("orbit");
  const off = camera.position.clone().sub(controls.target).normalize().multiplyScalar(dist);
  controls.target.copy(p); camera.position.copy(p).add(off); controls.update();
}

// ============================================================ interaction
function selectMarble(k) { if (!W) return; W.selected = k; }
$("tower").addEventListener("click", (e) => { const tr = e.target.closest("tr"); if (tr) { selectMarble(+tr.dataset.k); if (viewMode === "orbit") setViewMode("selected"); } });
$("camgrid").addEventListener("click", (e) => { const id = e.target.dataset && e.target.dataset.id; if (!id) return; const c = W.cams.find((c) => c.id === id); c.online = !c.online; logMsg(`${fmtT(W.phys.t)} ${id} ${c.online ? "restored" : "unplugged"} by operator`, c.online ? "ok" : "bad"); });
document.querySelectorAll("#tools [data-view]").forEach((b) => b.addEventListener("click", () => { zoomF = 1; $("zoom").value = 0; setViewMode(b.dataset.view); }));
$("fit").addEventListener("click", () => fitView(true));
$("zin").addEventListener("click", () => zoomBy(1.25)); $("zout").addEventListener("click", () => zoomBy(0.8));
$("zoom").addEventListener("input", (e) => { const target = Math.pow(6, +e.target.value / 100); zoomBy(target / zoomF); });
const ray = new THREE.Raycaster(), mouse = new THREE.Vector2(); let downAt = null;
renderer.domElement.addEventListener("pointerdown", (e) => (downAt = [e.clientX, e.clientY]));
renderer.domElement.addEventListener("pointerup", (e) => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 5 || !W) return;
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(W.meshes.map((m) => m.sphere));
  if (hits.length) selectMarble(hits[0].object.userData.k);
});
renderer.domElement.addEventListener("dblclick", (e) => {
  const r = renderer.domElement.getBoundingClientRect();
  mouse.set(((e.clientX - r.left) / r.width) * 2 - 1, -((e.clientY - r.top) / r.height) * 2 + 1); ray.setFromCamera(mouse, camera);
  const hits = ray.intersectObjects(W.root.children.filter((o) => o.isMesh).concat([ground]));
  if (hits.length) focusOn(hits[0].point, Math.max(0.3, camera.position.distanceTo(hits[0].point) * 0.45));
});
function applyToggles() {
  if (!W) return;
  W.camGroup.visible = $("tFrustums").checked; W.centerline.visible = $("tWaypoints").checked;
  $("feedOverlay").hidden = !$("tFeeds").checked;
}
["tLabels", "tBoxes", "tTrails", "tFrustums", "tFeeds", "tMinimap", "tWaypoints"].forEach((id) => $(id).addEventListener("change", applyToggles));
$("play").addEventListener("click", togglePlay);
function togglePlay() { playing = !playing; $("play").textContent = playing ? "Pause" : "Resume"; }
$("speed").addEventListener("change", (e) => (speed = +e.target.value));
function newRace(seed) { exitReplay(); $("banner").hidden = true; buildWorld(seed ?? Math.floor(Math.random() * 1e9)); W.mmX = null; if (!playing) togglePlay(); }
$("newRace").addEventListener("click", () => newRace());
$("restart").addEventListener("click", () => newRace(W.seed));
["map", "count", "laps", "rig", "chaos"].forEach((id) => $(id).addEventListener("change", () => newRace(W.seed)));
$("fCam").addEventListener("click", () => {
  const board = W.tracker.leaderboard(W.phys.t), lead = (board.find((e) => e.status !== "finished") || board[0]).i;
  const c = W.cams.find((c) => c.online && c.kind !== "finish" && c.covers(W.phys.m[lead].s)) || W.cams.find((c) => c.online);
  if (c) { c.online = false; logMsg(`${fmtT(W.phys.t)} fault: ${c.id} unplugged`, "bad"); }
});
$("fLight").addEventListener("click", () => { W.faults.dim = !W.faults.dim; $("fLight").classList.toggle("on", W.faults.dim); sun.intensity = W.faults.dim ? 0.45 : 0.95; logMsg(`${fmtT(W.phys.t)} fault: lights ${W.faults.dim ? "dimmed" : "restored"}`, W.faults.dim ? "bad" : "ok"); });
$("fNet").addEventListener("click", () => { W.faults.jitter = !W.faults.jitter; $("fNet").classList.toggle("on", W.faults.jitter); logMsg(`${fmtT(W.phys.t)} fault: network ${W.faults.jitter ? "dropping 12 % of frames" : "healthy"}`, W.faults.jitter ? "bad" : "ok"); });
$("fReset").addEventListener("click", () => { W.cams.forEach((c) => (c.online = true)); W.faults = { dim: false, jitter: false }; sun.intensity = 0.95; $("fLight").classList.remove("on"); $("fNet").classList.remove("on"); logMsg(`${fmtT(W.phys.t)} all faults cleared`, "ok"); });
$("replay").addEventListener("click", () => (replayMode ? exitReplay() : enterReplay()));
function enterReplay() {
  if (!W.replay.length) return;
  replayMode = true; $("replay").classList.add("on"); $("replay").textContent = "Back to live";
  $("scrub").disabled = false; $("scrub").max = W.replay.length - 1; replayIdx = Math.max(0, W.replay.length - 150); $("scrub").value = replayIdx;
  logMsg("Instant replay: drag the slider, or press play for slow motion", "");
}
function exitReplay() { replayMode = false; $("replay").classList.remove("on"); $("replay").textContent = "Instant replay"; $("scrub").disabled = true; }
$("scrub").addEventListener("input", (e) => (replayIdx = +e.target.value));
window.addEventListener("keydown", (e) => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT") return;
  const k = e.key;
  if (k === " ") { e.preventDefault(); togglePlay(); }
  else if (k === "r" || k === "R") newRace(W.seed);
  else if (k === "n" || k === "N") newRace();
  else if (k === "+" || k === "=") zoomBy(1.25);
  else if (k === "-" || k === "_") zoomBy(0.8);
  else if (k === "f" || k === "F") setViewMode("selected");
  else if (k === "v" || k === "V") { const order = ["orbit", "leader", "tv", "overhead", "finish"]; setViewMode(order[(order.indexOf(viewMode) + 1) % order.length]); }
  else if (k === "[" || k === "]") { const b = W.tracker.leaderboard(W.phys.t).map((x) => x.i), i = b.indexOf(W.selected); selectMarble(b[(i + (k === "]" ? 1 : -1) + b.length) % b.length]); }
  else if (/^[1-5]$/.test(k)) { $("map").value = Object.keys(MAPS)[+k - 1]; newRace(W.seed); }
});

function resize() {
  const w = view.clientWidth, h = view.clientHeight;
  renderer.setSize(w, h, false); renderer.domElement.style.width = w + "px"; renderer.domElement.style.height = h + "px";
  labelRenderer.setSize(w, h); camera.aspect = w / Math.max(1, h); camera.updateProjectionMatrix();
  const dpr = Math.min(2, window.devicePixelRatio || 1); feedCanvas.width = w * dpr; feedCanvas.height = h * dpr; feedCanvas.style.width = w + "px"; feedCanvas.style.height = h + "px";
}
new ResizeObserver(resize).observe(view);

let uiAcc = 0;
function loop(ts) {
  requestAnimationFrame(loop);
  const dt = lastTs == null ? 0 : Math.min(0.05, (ts - lastTs) / 1000); lastTs = ts;
  let frame = null;
  if (replayMode) {
    if (playing) { replayIdx = Math.min(W.replay.length - 1, replayIdx + dt * 30 * Math.min(speed, 0.5)); $("scrub").value = Math.floor(replayIdx); }
    frame = W.replay[Math.floor(replayIdx)];
    $("clock").textContent = "REPLAY " + (frame.t - (W.raceT0 ?? 0)).toFixed(2) + " s";
  } else if (playing) {
    if (W.state === "grid") updateLights(dt);
    else simulate(dt * speed);
    $("clock").textContent = W.state === "grid" ? "GRID" : Math.max(0, W.phys.t - (W.raceT0 ?? W.phys.t)).toFixed(2) + " s";
  }
  updateScene(dt, frame);
  updateCamera(dt);
  if (viewMode === "orbit") controls.update();
  render();
  uiAcc += dt;
  if (uiAcc > 0.1) { uiAcc = 0; renderTower(frame); renderHealth(); renderTelemetry(); drawMinimap(frame); }
}

// ============================================================ boot
Object.entries(MAPS).forEach(([k, m], i) => { const o = document.createElement("option"); o.value = k; o.textContent = `${i + 1}. ${m.name}`; $("map").append(o); });
$("map").value = location.hash && MAPS[location.hash.slice(1)] ? location.hash.slice(1) : "grandprix";
resize();
buildWorld(20261014);
requestAnimationFrame(loop);
</script>
