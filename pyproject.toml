[project]
name = "marbletrack"
version = "1.0.0"
description = "Real-time colour-based marble race tracking with multi-camera fusion"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "opencv-python-headless>=4.8"]

[project.optional-dependencies]
dev = ["pytest>=7"]
ndi = ["cyndilib>=0.1.3"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: end-to-end tests that start camera processes (deselect with -m 'not slow')"]
